<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Pinka ❤️ One by One</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1f1212, #2d1a1a);
            font-family: 'Segoe UI', 'Poppins', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            transition: background 1s ease;
        }

        body.final-mode {
            background: #ffddee;
            background-image: radial-gradient(circle, #ff4d6d 2px, transparent 2px), 
                              radial-gradient(circle, #ff8a9f 2px, transparent 2px);
            background-size: 60px 60px, 120px 120px;
            background-position: 0 0, 30px 30px;
            animation: floatBg 20s linear infinite;
        }

        @keyframes floatBg {
            0% { background-position: 0 0, 30px 30px; }
            100% { background-position: 60px 60px, 90px 90px; }
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: #fff5f5;
            border-radius: 80px 80px 50px 50px;
            padding: 30px 20px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 0 6px #ffb8c6 inset, 0 0 0 14px #ffe2e9 inset;
            border: 4px solid #ff8da1;
            position: relative;
            transition: all 0.5s;
            z-index: 10;
        }

        .container.final-container {
            background: #fff0f5;
            box-shadow: 0 30px 60px rgba(255, 77, 109, 0.5), 0 0 0 6px #ffb8c6 inset, 0 0 0 14px #ffe2e9 inset;
        }

        .pinka-header {
            text-align: center;
            font-size: 2.8rem;
            color: #b33b4d;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .pinka-sub {
            text-align: center;
            font-size: 1.8rem;
            color: #c24f4f;
            border-bottom: 3px dotted #ffa5b9;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .counter-badge {
            background: #ffc2cd;
            border-radius: 60px;
            padding: 12px 25px;
            display: inline-block;
            margin: 0 auto 20px;
            font-size: 1.9rem;
            border: 3px solid white;
            color: #982525;
            font-weight: bold;
            box-shadow: 0 5px 0 #b14d4d;
        }

        .gift-stage {
            background: #ffe4e9;
            border-radius: 60px 60px 40px 40px;
            padding: 25px 15px;
            margin: 25px 0;
            border: 5px dashed #ff819c;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s;
            box-shadow: inset 0 -5px 0 #ffb0b0;
            position: relative;
            overflow: hidden;
        }

        .reveal-box {
            width: 100%;
            text-align: center;
            animation: fadeScale 0.5s ease;
        }

        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .big-emoji {
            font-size: 5rem;
            margin: 10px 0;
            filter: drop-shadow(0 10px 10px #ff9eb5);
        }

        .memory-text {
            font-size: 2.2rem;
            font-weight: 600;
            color: #872222;
            margin: 15px 0;
            line-height: 1.4;
        }

        .small-note {
            font-size: 1.4rem;
            color: #a54b4b;
            margin-top: 15px;
        }

        .interactive-btn {
            background: #ffa5b9;
            border: none;
            color: #3e1c1c;
            font-size: 2.2rem;
            padding: 20px 45px;
            border-radius: 80px;
            font-weight: bold;
            margin: 25px 0 10px;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 10px 0 #ac4e62;
            transition: 0.05s linear;
            width: fit-content;
            z-index: 20;
            position: relative;
        }

        .interactive-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #ac4e62;
        }

        .interactive-btn.smaller {
            font-size: 1.8rem;
            padding: 15px 35px;
        }

        .reset-link {
            background: transparent;
            border: 2px dashed #e79baa;
            color: #b15757;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 30px;
            z-index: 20;
            position: relative;
        }

        .floating-heart {
            position: fixed;
            color: #ff5f8f;
            font-size: 2rem;
            pointer-events: none;
            animation: rise 4s linear forwards;
            z-index: 9999;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
        }

        .song-tile {
            background: #fcc4d0;
            border-radius: 70px;
            padding: 25px;
            width: 100%;
            cursor: pointer;
            border: 5px solid white;
            box-shadow: 0 8px 0 #c26377;
        }

        .joke-display {
            background: white;
            border-radius: 60px;
            padding: 25px;
            font-size: 1.9rem;
            border: 4px solid #ff7e9f;
            margin-top: 20px;
        }

        .progress-dots {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0 5px;
        }

        .dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fbbbc6;
            border: 3px solid #fd8fa5;
            transition: 0.2s;
        }

        .dot.active {
            background: #ff4d6d;
            border-color: white;
            transform: scale(1.3);
            box-shadow: 0 0 20px #ffa0b1;
        }

        /* FINAL SURPRISE CAKE STYLES */
        .balloon-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            font-size: 3rem;
            animation: floatBalloon 8s ease-in-out infinite;
            opacity: 0.8;
            filter: drop-shadow(0 10px 8px rgba(255, 0, 85, 0.4));
        }

        @keyframes floatBalloon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .cake-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            z-index: 15;
        }

        .cake {
            background: #f9a8b8;
            width: 280px;
            height: 120px;
            border-radius: 40px 40px 20px 20px;
            position: relative;
            box-shadow: 0 15px 0 #b85c6e;
            border: 4px solid white;
            z-index: 5;
        }

        .cake-layer {
            background: #fcb5c3;
            width: 260px;
            height: 40px;
            border-radius: 30px;
            position: absolute;
            top: -25px;
            left: 10px;
            box-shadow: 0 8px 0 #b85c6e;
            border: 3px solid white;
        }

        .cake-layer2 {
            background: #ffc1d0;
            width: 220px;
            height: 35px;
            border-radius: 30px;
            position: absolute;
            top: -50px;
            left: 30px;
            box-shadow: 0 6px 0 #b85c6e;
            border: 3px solid white;
        }

        .candle {
            width: 30px;
            height: 90px;
            background: linear-gradient(145deg, #f5e6d3, #ffdbb5, #fff0e0);
            border-radius: 15px 15px 5px 5px;
            border: 4px solid white;
            box-shadow: 0 10px 0 #b38b6b, 0 0 30px rgba(255, 215, 0, 0.5);
            z-index: 9999;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            margin-top: 20px;
        }
        .candle:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 0 #b38b6b, 0 0 50px #ffae42;
        }

        .flame {
            position: absolute;
            top: -50px;
            left: -8px;
            width: 46px;
            height: 60px;
            background: radial-gradient(circle at 50% 100%, #ffd966 0%, #ff944d 40%, #ff4d4d 70%, #ffaa00 100%);
            border-radius: 60% 60% 30% 30%;
            transform: rotate(180deg);
            filter: drop-shadow(0 -10px 30px #ff6a00) drop-shadow(0 0 40px #ffaa33);
            animation: flicker 0.15s ease-in-out infinite;
            z-index: 10000;
            cursor: pointer;
            pointer-events: none;
        }

        .flame.extinguished {
            display: none;
        }

        @keyframes flicker {
            0%, 100% { transform: rotate(180deg) scale(1); opacity: 1; filter: drop-shadow(0 -10px 30px #ffae42); }
            25% { transform: rotate(182deg) scale(1.1); opacity: 0.95; filter: drop-shadow(0 -15px 40px #ff6f00); }
            50% { transform: rotate(178deg) scale(0.95); opacity: 0.9; filter: drop-shadow(0 -8px 25px #ffae42); }
            75% { transform: rotate(181deg) scale(1.08); opacity: 0.98; filter: drop-shadow(0 -12px 35px #ff8c00); }
        }

        .smoke {
            position: absolute;
            top: -50px;
            left: 5px;
            width: 15px;
            height: 20px;
            background: rgba(200, 200, 200, 0.5);
            border-radius: 50%;
            filter: blur(5px);
            animation: smokeRise 2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes smokeRise {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateY(-80px) scale(3); opacity: 0; }
        }

        .wish-message-container {
            margin-top: 30px;
            text-align: center;
            z-index: 20;
            position: relative;
        }

        .wish-message {
            font-size: 2.2rem;
            color: #b33b4d;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 60px;
            display: inline-block;
            box-shadow: 0 8px 0 #ff9eb5;
            border: 4px solid white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .happy-birthday-text {
            position: fixed;
            top: -200px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 5rem;
            font-weight: 900;
            color: #ff1a4c;
            text-shadow: 5px 5px 0 #ffffff, 10px 10px 20px #ff99aa;
            z-index: 99999;
            animation: dropDown 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes dropDown {
            0% { top: -200px; transform: scale(0.5); opacity: 0; }
            70% { top: 40%; transform: scale(1.1); }
            100% { top: 30%; transform: scale(1); opacity: 1; }
        }

        .audio-controls {
            display: none;
        }

        /* Fix for the gift stage content */
        #stageContent {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div id="heartContainer" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999;"></div>

<!-- Hidden audio elements -->
<audio id="bgMusic" loop>
    <source src="happysong.mp3" type="audio/mpeg">
</audio>

<audio id="ourSong">
    <source src="Apnaa.mp3" type="audio/mpeg">
</audio>

<div class="container" id="mainContainer">
    <div class="pinka-header">💗 Priyanka Sharma 💗</div>
    <div class="pinka-sub">( my Pinka 💗)</div>

    <!-- Progress dots -->
    <div class="progress-dots" id="progressDots"></div>

    <div style="text-align: center; margin: 10px 0 5px;">
        <span class="counter-badge" id="counterDisplay">Surprise 1/8</span>
    </div>

    <!-- Main stage -->
    <div class="gift-stage" id="giftStage">
        <div id="stageContent" class="reveal-box">
            <div class="big-emoji">🎁</div>
            <div class="memory-text">Happy Birthday, Priyanka!</div>
            <div class="small-note">I have some close moments that we shared together with you.<br>One click = one smile ❤️</div>
        </div>
    </div>

    <!-- Main button -->
    <button class="interactive-btn" id="mainBtn">Give me my first surprise 💕</button>

    <!-- Reset button -->
    <div style="text-align: center; margin-top: 20px;">
        <button class="reset-link" id="resetBtn">start over ↺</button>
    </div>
</div>

<script>
(function() {
    // Surprises array
    const surprises = [
        { emoji: "😄", title: "Before going to that moments, I'm sharing some inner feeling with you", message: "You know what makes you smile?", interactive: "joke", line: "My stupid jokes 😝" },
        { emoji: "🥊", title: "Your Love Language", message: "You always say...", interactive: "maar", line: "MAAR DUNGI! 😤" },
        { emoji: "😤🖤", title: "My First Jealous Feeling", message: "12 June 2022", interactive: "jealousy", line: "You danced with someone else that day... and my heart burned I don't know why. I think Not with anger — with realization. That's when I knew: I want to be the only one who makes you smile, who holds you, who dances with you. 😤💘" },   
        { 
            emoji: "💃🕺", 
            title: "Our First Dance", 
            message: "14 June 2022", 
            interactive: "dance", 
            line: "This is not just a dance — it's my feeling. That day, I realized how I could make myself perfect for you, not just in talking, but in reality. I enjoyed every moment. This was my best dance ever on stage, and it happened because of you. You gave me the courage to express, to show myself — something that never happened before. But when I met you, my courage became double. That time, I didn't realize if I felt for you or not, but it was something different.\n\nThat day, you gave me a rose, and I didn't accept it — I don't know why. But somehow, I did accept it, and that rose is still with me, in my bag. That's where our journey started, and it still goes on.\n\nEnjoy that day's dance by clicking the link below 💕" 
        },
        { 
            emoji: "🎬🍿", 
            title: "Our First Movie Date", 
            message: "29 July 2022", 
            interactive: "movie", 
            line: "Our first movie was 'Ek Villain Returns'. I don't even remember how I asked you to come with me — because that day we had an exam in college! But we still went on a movie date.\n\nWhen we were in the theater, sitting on those chairs, I wanted to hold your hand so badly. But I didn't have the courage 🤣🤣. So I just sat there, nervous. And you didn't hold my hand either — I think it's okay. The first time is always a little messy, right?\n\nIn the evening, we cut the cake and just enjoyed the moment. That day — my birthday — became special because of you.\n\nIf you want to see that moment, click the link below 💕" 
        },
        { emoji: "💋", 
        title: "Our First Kiss", 
        message: "26th August 2022", 
        interactive: "kiss", 
        line: "It happened because of you... you gave me that dare 💕" 
        },
        { emoji: "🌙", 
        title: "Our First Night Together 19 january 2023", 
        message: "The night I'll never forget", 
        interactive: "firstnight", 
        line: "Holding each other, messy but perfect 💕" 
        },
        { emoji: "💃", 
        title: "Our Last College Dance", 
        message: "6th May 2023 - Farewell", 
        interactive: "lastdance", 
        line: "Our last close moment in college ❤️" 
        },
        { emoji: "❤️❤️❤️", title: "My Pinka", message: "Happy Birthday my love", interactive: "final", line: "I love you more than all the stupid jokes in the world 💘" }
    ];

    let currentIndex = -1;
    const totalSurprises = surprises.length;

    // DOM elements
    const stageContent = document.getElementById('stageContent');
    const mainBtn = document.getElementById('mainBtn');
    const resetBtn = document.getElementById('resetBtn');
    const counterDisplay = document.getElementById('counterDisplay');
    const progressDots = document.getElementById('progressDots');
    const heartContainer = document.getElementById('heartContainer');
    const mainContainer = document.getElementById('mainContainer');
    const body = document.body;
    const bgMusic = document.getElementById('bgMusic');
    const ourSong = document.getElementById('ourSong');

    // Initialize dots
    function initDots() {
        progressDots.innerHTML = '';
        for (let i = 0; i < totalSurprises; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            progressDots.appendChild(dot);
        }
        updateDots();
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index <= currentIndex) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }

    // Heart creator
    function createHearts(count = 10) {
        for (let i = 0; i < count; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = ['❤️','🧡','💛','💚','💙','💜','💖','💗','💓','💞'][Math.floor(Math.random()*10)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            heart.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
            heartContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    }

    // Play background music
    function playBgMusic() {
        bgMusic.volume = 0.3;
        bgMusic.play().catch(e => console.log("Autoplay blocked"));
    }

    // Play our song
    function playOurSong() {
        ourSong.currentTime = 0;
        ourSong.volume = 0.7;
        ourSong.play().catch(e => console.log("Couldn't play song"));
        createHearts(18);
    }

    // Jokes array
    const stupidJokes = [
        "Have you ever noticed?\n\nYou smile at my stupid jokes — even the ones that don't make sense.\nYou blush at my dirty talks — hiding your face but loving every word.\nI tease you, again and again, and you never take it seriously.\n\nYou just... trust me.\nYou trust that behind every tease is love.\nBehind every dirty word is adoration.\nBehind every stupid joke is a boy who just wants to see you smile.\n\nAnd that's not just 'good for me.'\nThat's the most beautiful thing you could ever give me. 💕"
    ];

    // Create balloon background
    function createBalloonBackground() {
        const balloonContainer = document.createElement('div');
        balloonContainer.className = 'balloon-bg';
        balloonContainer.id = 'balloonBg';
        
        const balloonEmojis = ['❤️', '🧡', '💛', '💚', '💙', '💜', '💖', '💗'];
        for (let i = 0; i < 20; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.innerHTML = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.top = Math.random() * 100 + '%';
            balloon.style.animationDelay = Math.random() * 5 + 's';
            balloon.style.fontSize = (2 + Math.random() * 3) + 'rem';
            balloonContainer.appendChild(balloon);
        }
        
        document.querySelector('.gift-stage').appendChild(balloonContainer);
    }

    // Create cake with candle and wish message BELOW
    // Create cake with candle and wish message BELOW
    function createCakeWithCandle() {
        // Clear stage content
        stageContent.innerHTML = '';
        
        // Create cake container with full visibility
        const cakeContainer = document.createElement('div');
        cakeContainer.className = 'cake-container';
        cakeContainer.id = 'cakeContainer';
        
        cakeContainer.innerHTML = `
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; width:100%;">
                <!-- Candle positioned ABOVE everything with extra space -->
                <div style="position:relative; height:140px; width:100%; display:flex; justify-content:center; z-index:1000; margin-bottom:10px;">
                    <div class="candle" id="birthdayCandle" style="position:relative; top:0;">
                        <div class="flame" id="flame"></div>
                    </div>
                </div>
                
                <!-- Cake below the candle with clear space -->
                <div style="margin-top:0;">
                    <div class="cake">
                        <div class="cake-layer"></div>
                        <div class="cake-layer2"></div>
                    </div>
                </div>
            </div>
        `;
        
        // Create wish message container (BELOW the cake)
        const wishContainer = document.createElement('div');
        wishContainer.className = 'wish-message-container';
        wishContainer.innerHTML = `
            <div class="wish-message" id="wishMessage">✨ Make a Wish and blow the candle! ✨</div>
        `;
        
        // Append both to stageContent
        stageContent.appendChild(cakeContainer);
        stageContent.appendChild(wishContainer);
        
        // Add candle click event
        document.getElementById('birthdayCandle').addEventListener('click', function() {
            const flame = document.getElementById('flame');
            if (!flame.classList.contains('extinguished')) {
                flame.classList.add('extinguished');
                
                // Create smoke effect
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        const smoke = document.createElement('div');
                        smoke.className = 'smoke';
                        const rect = this.getBoundingClientRect();
                        smoke.style.left = (rect.left + rect.width/2 - 30 + Math.random() * 40) + 'px';
                        smoke.style.top = (rect.top - 20) + 'px';
                        document.body.appendChild(smoke);
                        setTimeout(() => smoke.remove(), 2000);
                    }, i * 100);
                }
                
                // Show Happy Birthday text
                const hbdText = document.createElement('div');
                hbdText.className = 'happy-birthday-text';
                hbdText.innerHTML = 'Happy Birthday Pinka! ❤️';
                document.body.appendChild(hbdText);
                
                // Update wish message
                document.getElementById('wishMessage').innerHTML = '🎉 Wish granted! I love you, Pinka! 🎉';
                
                // Massive heart explosion
                createHearts(60);
                
                // Remove text after 5 seconds
                setTimeout(() => {
                    hbdText.remove();
                }, 5000);
            }
        });
    }

    // Display current surprise
    function displayCurrent() {
        if (currentIndex === -1) {
            stageContent.innerHTML = `
                <div class="big-emoji">🎁💝🎁</div>
                <div class="memory-text">Happy Birthday, Pinka!</div>
                <div class="small-note">I have some close moments that we shared together.<br>One click = one smile ❤️</div>
            `;
            counterDisplay.innerText = `Ready to start?`;
            mainBtn.innerText = 'Give me Our first Moment 💕';
            return;
        }

        const s = surprises[currentIndex];
        counterDisplay.innerText = `Surprise ${currentIndex+1}/${totalSurprises}`;
        
        // Check if final surprise
        if (s.interactive === 'final') {
            // Clear everything
            stageContent.innerHTML = '';
            
            // Set final mode
            body.classList.add('final-mode');
            mainContainer.classList.add('final-container');
            
            // Create balloon background
            createBalloonBackground();
            
            // Create cake with candle (wish message will be below)
            createCakeWithCandle();
            
            // Final burst
            createHearts(30);
            
            mainBtn.innerText = 'I love you Pinka ❤️';
            return;
        }

        // Regular surprises
        let html = `
            <div class="big-emoji">${s.emoji}</div>
            <div class="memory-text">${s.title}</div>
        `;

        if (s.interactive === 'joke') {
            html += `
                <div style="margin: 20px 0;">
                    <div class="song-tile" id="jokeTrigger" style="background:#ffd1dc;">
                        <span style="font-size:2.5rem;">💗</span>
